  # Tag Cloud management
  label_new_tag_cloud: Новое облако тегов
  label_edit_tag_cloud: Редактировать облако тегов
  label_default_tag_cloud: Облако по умолчанию
  label_hidden_tag_clouds: Скрытые облака тегов
  label_tag_cloud_name: Название
  label_tag_cloud_filters: Фильтры
  label_tag_cloud_status_filter: Фильтр по статусам
  label_tag_cloud_version_filter: Фильтр по версиям
  label_tag_cloud_tracker_filter: Фильтр по трекерам
  label_tag_cloud_visible_by_default: Видимо по умолчанию
  label_tag_cloud_include_subprojects: Показывать облако в подпроектах
  label_tag_cloud_show_in_subprojects: Показ в подпроектах
  text_tag_cloud_include_subprojects_hint: Управляет только отображением этого облака в сайдбаре подпроектов. Подсчёт тегов всегда совпадает со списком задач (включая подпроекты, если в Redmine включено «Отображать задачи подпроектов»).
  label_tag_cloud_position: Позиция
  label_tag_cloud_system: системное
  label_tag_cloud_system_cloud: Системное облако
  label_tag_cloud_drag_to_reorder: Перетащите, чтобы изменить порядок отображения
  button_collapse: Свернуть
  text_tag_cloud_filters_empty_means_all: пусто = Любые / все
  text_tag_clouds_info: Облака тегов позволяют создавать несколько независимых аналитических представлений задач с собственными фильтрами. Облако «Теги» по умолчанию всегда отображается и сохраняет поведение оригинального плагина.
  text_tag_clouds_permissions_info: "Права (Роли и права → Отслеживание задач): Управление облаками тегов — создание/редактирование/удаление (требуется членство в проекте). Выбор видимых облаков — персональная видимость и порядок в сайдбаре. Правило видимости облака (Все / Владелец / Роли) дополнительно ограничивает, кто видит каждое пользовательское облако."
  text_cannot_delete_system_cloud: Облако «Теги» виртуальное и всегда видно; его нельзя удалить.
  text_tag_clouds_global_list_info: Здесь отображаются все пользовательские облака тегов по всем проектам. Можно редактировать и удалять. Создание новых облаков и изменение порядка выполняется в Проект → Настройки → Облака тегов.
  notice_tag_cloud_created: Облако тегов успешно создано.
  notice_tag_cloud_updated: Облако тегов успешно обновлено.
  notice_tag_cloud_deleted: Облако тегов успешно удалено.
  alert_cannot_delete_system_cloud: Облако по умолчанию нельзя удалить.

  # Visibility
  label_tag_cloud_visibility_rule: Видимость
  label_tag_cloud_visibility_all: Все пользователи
  label_tag_cloud_visibility_owner: Только владелец
  label_tag_cloud_visibility_roles: Выбранные роли
  label_tag_cloud_owner: Владелец
  text_tag_cloud_visibility_hint: Определяет, кто видит облако в боковой панели задач (до персональной настройки). Пользователи с правом «Выбор видимых облаков» могут переопределить видимость для себя.
  text_tag_cloud_roles_required: Выберите хотя бы одну роль. Пользователь должен иметь одну из этих ролей в проекте, чтобы видеть облако.
  text_tag_cloud_visible_by_default_hint: При видимости «Все пользователи» снятие галочки скрывает облако, пока пользователь не включит его в «Выбрать видимые облака».

  # Tag filter whitelist
  label_tag_cloud_tag_filter: Белый список тегов
  label_tag_cloud_tag_filter_enable: Ограничить облако выбранными тегами
  text_tag_cloud_tag_filter_hint: Если включено, в облаке показываются только выбранные теги (с учётом фильтров статус/версия/трекер). Если включено и теги не выбраны — облако пустое.
  text_tag_cloud_no_tags_in_project: В задачах этого проекта пока нет тегов.

  # Select visible tag clouds modal
  label_select_visible_tag_clouds: Выбрать видимые облака тегов
  label_tag_clouds_visibility: Видимые облака тегов
  text_select_visible_tag_clouds_hint: Выберите, какие пользовательские облака тегов показывать в боковой панели задач. Перетаскивайте строки, чтобы изменить порядок.
  notice_tag_cloud_preferences_updated: Настройки видимости облаков тегов обновлены.
  notice_failed_to_update_tag_cloud_preferences: Не удалось обновить настройки видимости облаков тегов.
